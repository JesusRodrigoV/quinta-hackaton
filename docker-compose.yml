services:
  # --- INFRAESTRUCTURA CORE ---
  
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb_telemetry
    environment:
      POSTGRES_USER: urbanflow_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: telemetry_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanflow_user -d telemetry_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbanflow-net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka_urbanflow
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - urbanflow-net

  redis:
    image: redis:alpine
    container_name: redis_signals
    ports:
      - "6379:6379"
    networks:
      - urbanflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:latest
    container_name: neo4j_routing
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/password
    networks:
      - urbanflow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 10

  mongo:
    image: mongo:latest
    container_name: mongo_mobility
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - urbanflow-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MICROSERVICIOS DE LA HACKATON ---

  telemetry-tracking-service:
    build:
      context: ./backend/telemetry-tracking-service
    container_name: telemetry_tracking_service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: 5432
      KAFKA_TOPIC_BUS_LOCATION_UPDATED: bus-location-updated
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - urbanflow-net

  routing-service:
    build:
      context: ./routing-service
    container_name: routing_service
    ports:
      - "8001:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_BUS_LOCATION_UPDATED: bus-location-updated
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - urbanflow-net

  shared-mobility-service:
    build:
      context: ./ms-shared-mobility
    container_name: shared_mobility_service
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: mobility_hub
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8000"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - urbanflow-net

  traffic-light-service:
    build:
      context: ./ms-traffic-light
    container_name: traffic_light_service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: audit-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: audit_password_123
      POSTGRES_DATABASE: audit_db
      KAFKA_TOPIC_BUS_DELAYED: tracking.bus.delayed
      KAFKA_TOPIC_CONGESTION_ALERT: congestion.alert.created
      KAFKA_TOPIC_SIGNAL_REROUTE: signal.reroute.confirmed
    ports:
      - "8004:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      audit-db:
        condition: service_healthy
    networks:
      - urbanflow-net

  audit-service:
    build:
      context: ./ms-audit
    container_name: audit_service
    environment:
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: audit_password_123
      POSTGRES_HOST: audit-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: audit_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_REROUTE: signal.reroute.confirmed
      KAFKA_TOPIC_TARIFF: payment.tariff.changed
      SECRET_CRYPTO_SALT: hackathon_secret_salt
    ports:
      - "8003:8000"
    depends_on:
      audit-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - urbanflow-net

  audit-db:
    image: postgres:15-alpine
    container_name: audit_db_regulatory
    environment:
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: audit_password_123
      POSTGRES_DB: audit_db
    ports:
      - "5434:5432"
    networks:
      - urbanflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_admin -d audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- NUESTRO PAYMENT SERVICE ---

  payment-db:
    image: postgres:15-alpine
    container_name: payment_db_acid
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: payments_db
    ports:
      - "5432:5432"
    volumes:
      - ./ms-unified-payment/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - urbanflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-app:
    build:
      context: ./ms-unified-payment
    container_name: payment_service_app
    environment:
      DB_HOST: payment-db
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: payments_db
    ports:
      - "3000:3000"
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - urbanflow-net

networks:
  urbanflow-net:
    driver: bridge

volumes:
  timescaledb-telemetry-data:
  kafka-urbanflow-data:
  neo4j_data:
  mongo_data:
