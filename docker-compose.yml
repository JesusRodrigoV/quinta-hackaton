services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb_telemetry
    environment:
      POSTGRES_USER: urbanflow_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: telemetry_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanflow_user -d telemetry_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - timescaledb-telemetry-data:/var/lib/postgresql/data
      - ./backend/telemetry-tracking-service/database/init.sql:/docker-entrypoint-initdb.d/001-init-telemetry.sql:ro
    networks:
      - urbanflow-net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka_urbanflow
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-urbanflow-data:/var/lib/kafka/data
    networks:
      - urbanflow-net

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka_init_urbanflow
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic bus-location-updated \
          --partitions 3 \
          --replication-factor 1
    networks:
      - urbanflow-net

  telemetry-tracking-service:
    build:
      context: ./backend/telemetry-tracking-service
      dockerfile: Dockerfile
    container_name: telemetry_tracking_service
    env_file:
      - ./backend/telemetry-tracking-service/.env
    environment:
      APP_ENV: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - urbanflow-net

  neo4j:
    image: neo4j:2026.05-community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - urbanflow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 15
      start_period: 10s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest-fips
    ports:
      - "9093:9092" # <-- ¡CORRECCIÓN! Cambiado el host a 9093 para no chocar con Kafka
    command:
      - redpanda
      - start
      - --mode dev-container
    healthcheck:
      test: rpk cluster info
      interval: 5s
      retries: 15
      start_period: 10s
    networks:
      - urbanflow-net
    restart: unless-stopped

  routing-service:
    build: ./routing-service
    ports:
      - "8001:8000" # <-- ¡CORRECCIÓN! Cambiado el host a 8001 para no chocar con telemetry-tracking-service
    env_file: ./routing-service/.env
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - urbanflow-net
    restart: unless-stopped
    volumes:
      - ./routing-service:/app

networks:
  urbanflow-net:
    driver: bridge

volumes:
  timescaledb-telemetry-data:
  kafka-urbanflow-data:
  neo4j_data: