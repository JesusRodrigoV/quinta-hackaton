# docker-compose.yml
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb_telemetry
    environment:
      POSTGRES_USER: urbanflow_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: telemetry_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanflow_user -d telemetry_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - timescaledb-telemetry-data:/var/lib/postgresql/data
      - ./backend/telemetry-tracking-service/database/init.sql:/docker-entrypoint-initdb.d/001-init-telemetry.sql:ro
    networks:
      - urbanflow-net

  kafka:
    image: apache/kafka:latest
    container_name: kafka_urbanflow
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - kafka-urbanflow-data:/var/lib/kafka/data
    networks:
      - urbanflow-net

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka_init_urbanflow
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic bus-location-updated --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tracking.bus.delayed --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic congestion.alert.created --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic signal.reroute.confirmed --partitions 1 --replication-factor 1
        echo "All topics created successfully"
    networks:
      - urbanflow-net

  redis:
    image: redis:7-alpine
    container_name: redis_urbanflow
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - urbanflow-net

  postgres-audit:
    image: postgres:15-alpine
    container_name: postgres_audit_urbanflow
    environment:
      POSTGRES_USER: urbanflow_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: audit_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanflow_user -d audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
      - ./backend/traffic-light-service/database/init.sql:/docker-entrypoint-initdb.d/001-init-audit.sql:ro
    networks:
      - urbanflow-net

  telemetry-tracking-service:
    build:
      context: ./backend/telemetry-tracking-service
      dockerfile: Dockerfile
    container_name: telemetry_tracking_service
    env_file:
      - ./backend/telemetry-tracking-service/.env
    environment:
      APP_ENV: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - urbanflow-net

  traffic-light-service:
    build:
      context: ./backend/traffic-light-service
      dockerfile: Dockerfile
    container_name: traffic_light_service
    env_file:
      - ./backend/traffic-light-service/.env
    environment:
      APP_ENV: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres-audit
      POSTGRES_PORT: 5432
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - urbanflow-net

networks:
  urbanflow-net:
    driver: bridge

volumes:
  timescaledb-telemetry-data:
  postgres-audit-data:
  redis-data:
  kafka-urbanflow-data:
